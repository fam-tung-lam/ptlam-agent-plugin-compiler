name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.event_name == 'pull_request' && format('pr-{0}',
    github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI Required
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up the minimum supported Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.6.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run static checks
        run: |
          npm run code:typecheck
          npm run code:check
          npm run markdown:check

      - name: Run tests
        run: npm test

      - name: Pack and exercise the exact artifact
        env:
          PACKAGE_DIR: ${{ runner.temp }}/package
        run: |
          mkdir -p "${PACKAGE_DIR}"
          npm pack --ignore-scripts --pack-destination "${PACKAGE_DIR}"

          tarballs=("${PACKAGE_DIR}"/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 || ! -f "${tarballs[0]}" ]]; then
            echo "Expected exactly one package tarball in ${PACKAGE_DIR}" >&2
            exit 1
          fi

          npm run test:package -- "${tarballs[0]}"
