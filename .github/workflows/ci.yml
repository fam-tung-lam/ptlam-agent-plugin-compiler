name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.event_name == 'pull_request' && format('pr-{0}',
    github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI Required
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup-node
        with:
          node-version: 22.6.0

      - name: Validate package metadata
        run: >-
          node --experimental-strip-types
          .github/scripts/validate-package-metadata.ts

      - name: Install dependencies
        run: npm ci

      - name: Validate a changed release version
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          node --experimental-strip-types
          .github/scripts/validate-release-version.ts

      - name: Run TypeScript checks
        run: npm run code:typecheck

      - name: Run code checks
        run: npm run code:check

      - name: Run documentation checks
        run: npm run markdown:check

      - name: Build the public WebApp
        run: npm run webapp:build

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: warn
          retention-days: 14

      - name: Pack and exercise the exact artifact
        id: package
        env:
          PACKAGE_DIR: ${{ runner.temp }}/release-candidate
        run: >-
          node --experimental-strip-types
          .github/scripts/pack-release-candidate.ts

      - name: Prepare release candidate metadata
        if: ${{ github.event_name == 'push' }}
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
          TARBALL_NAME: ${{ steps.package.outputs.name }}
          TARBALL_INTEGRITY: ${{ steps.package.outputs.integrity }}
          TARBALL_SHASUM: ${{ steps.package.outputs.shasum }}
        run: >-
          node --experimental-strip-types
          .github/scripts/prepare-release-candidate.ts

      - name: Upload the tested release candidate
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          retention-days: 90
