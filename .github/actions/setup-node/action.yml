name: Set up Node.js
description: Set up pinned Node.js and optional npm runtimes.

inputs:
  node-version:
    description: Node.js version to install.
    required: true
  registry-url:
    description: Optional npm registry URL.
    required: false
    default: ""
  npm-version:
    description: Optional npm version to install globally.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up Node.js without a registry
      if: ${{ inputs.registry-url == '' }}
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Set up Node.js with a registry
      if: ${{ inputs.registry-url != '' }}
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        package-manager-cache: false

    - name: Install the selected npm version
      if: ${{ inputs.npm-version != '' }}
      shell: bash
      run: npm install --global "npm@${{ inputs.npm-version }}" --ignore-scripts
